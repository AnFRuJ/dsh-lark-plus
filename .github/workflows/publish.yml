name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing (OIDC): the runner exchanges this for a short-lived
  # publish credential, so no long-lived NPM_TOKEN secret is needed.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm test

      - run: pnpm run build

      # Publish through npm (the reference OIDC implementation): with
      # id-token: write and no NODE_AUTH_TOKEN, npm exchanges the GitHub OIDC
      # token for a one-shot publish credential. pnpm keeps owning install,
      # check, test and build.
      - run: npm publish --access public
