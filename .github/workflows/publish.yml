name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing (OIDC): the runner exchanges this for a short-lived
  # publish credential, so no long-lived NPM_TOKEN secret is needed.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm test

      - run: pnpm run build

      # A GitHub Release for an already-published version (e.g. one published
      # locally, like 0.1.3) must not fail the run: check first and publish only
      # when the registry does not have this version yet.
      - id: version-check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "dsh-lark-plus@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version-check.outputs.exists == 'true'
        run: echo "::notice::dsh-lark-plus@${{ steps.version-check.outputs.version }} is already on the registry — skipping npm publish."

      # Publish through npm (the reference OIDC implementation): with
      # id-token: write and no NODE_AUTH_TOKEN, npm exchanges the GitHub OIDC
      # token for a one-shot publish credential. pnpm keeps owning install,
      # check, test and build.
      - if: steps.version-check.outputs.exists == 'false'
        run: npm publish --access public
